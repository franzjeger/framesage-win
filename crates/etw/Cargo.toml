[package]
name = "framesage-etw"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "v0.7 closed-loop ETW kernel-event consumer for the framesage-svc service host."

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# tokio::sync::oneshot for the consumer-thread → supervisor exit
# signal (per §3.5 + §3.6). We don't need the runtime here — just
# the sync primitives — but pulling tokio through workspace deps
# locks the version.
tokio = { workspace = true }
# parking_lot::Mutex for ConsumerState.trace_handle (avoids the
# poison-on-panic semantics of std::sync::Mutex, which would
# interact with the catch_unwind boundary in unintended ways).
parking_lot = { workspace = true }
# static_assertions is promoted from dev-deps to regular deps in v4.2
# Day 3: the assert_impl_all!(ConsumerState: RefUnwindSafe) guard in
# supervisor.rs fires at every compile (not just test compile), so
# the macro must be visible to all builds. The macro expands to a
# const trait check in release builds — zero runtime cost.
static_assertions = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    # Day 1 in-flight correction: plan §3.1 said RtlGetVersion lived
    # under Win32_System_SystemInformation, but in windows-rs 0.58 it
    # actually lives in Wdk::System::SystemServices (links ntdll.dll
    # "system" fn). We enable that feature here. The plan stop gate
    # ("don't fall back to GetVersionEx") is honored — this is the
    # documented user-mode binding at a different path, not a kernel
    # driver or BYOVD. To be folded into a small plan-fix-up amendment
    # alongside Day 5's EOD report (per user's "fix in code, don't
    # re-plan" guidance, 2026-05-17).
    "Wdk_System_SystemServices",
] }

[dev-dependencies]
# tracing-test provides #[traced_test] attribute + logs_contain
# assertion for the Mode 5 test in §4 Day 4. Per v3 secondary
# decision (Option C — defer channel wiring to Group C): the
# panic event is emitted via tracing::error! in production;
# tests assert on captured tracing output rather than a channel
# send. Dev-only — does NOT ship in the production binary.
tracing-test = "0.2"
# serial_test provides #[serial] for tests that must not run in
# parallel. Real-Windows finding from the Step 9 batch run:
# parallel StartTraceW calls from within the same process
# serialize at the kernel level and return ERROR_ALREADY_EXISTS
# even with disjoint session names — empirically reproduced in
# Isolation B (two #[ignore]'d real-ETW tests, unique names,
# default parallel → both fail with AlreadyExists). The two
# real-ETW tests are now annotated #[serial_test::serial]; mock
# tests stay parallel for fast feedback. Production only ever
# creates one ETW session per service instance so the constraint
# is invisible in normal operation.
serial_test = "3"
