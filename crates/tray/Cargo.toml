[package]
name = "framesage-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "framesage tray UI: egui-based status indicator, settings, and live monitoring."

[[bin]]
name = "framesage-tray"
path = "src/main.rs"

[dependencies]
framesage-core = { workspace = true }
framesage-ipc = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
# Item 3.2 — parking_lot::Mutex for AppState + TrayCommands. Smaller +
# faster than std::sync::Mutex on the uncontended path and the
# infallible `.lock()` API removes 31 `.lock().unwrap()` callsites
# in this crate. Engine already uses parking_lot::RwLock for the
# same reasons (item 2.10).
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
# Item 2.9 — serde derives for PersistedActivityEvent (activity.jsonl
# schema). serde_json already pulled the runtime in; deriving here
# adds only the macro path.
serde = { workspace = true }
serde_json = { workspace = true }
tray-icon = { workspace = true }

[dev-dependencies]
# Item 2.9 — temp dirs that clean up on drop for the activity-log
# round-trip + rotation tests.
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
framesage-sys = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Windows-host-only: synthesise an .ico from the same logo math used at
# runtime and embed it into the .exe so Explorer / Start / Alt-Tab show the
# FrameSage mark. We don't enable this for Linux-host cross-builds because
# embed-resource invokes windres there, and CI's cross-check job doesn't
# install mingw-w64 — gating on cfg(target_os = "windows") and host_os via
# build.rs keeps that job lean.
[build-dependencies]
ico = "0.3"
embed-resource = "3"
