[package]
name = "framesage-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "framesage tray UI: egui-based status indicator, settings, and live monitoring."

[[bin]]
name = "framesage-tray"
path = "src/main.rs"

[dependencies]
framesage-core = { workspace = true }
framesage-ipc = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
tray-icon = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Windows-host-only: synthesise an .ico from the same logo math used at
# runtime and embed it into the .exe so Explorer / Start / Alt-Tab show the
# FrameSage mark. We don't enable this for Linux-host cross-builds because
# embed-resource invokes windres there, and CI's cross-check job doesn't
# install mingw-w64 — gating on cfg(target_os = "windows") and host_os via
# build.rs keeps that job lean.
[build-dependencies]
ico = "0.3"
embed-resource = "3"
