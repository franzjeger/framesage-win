[package]
name = "framesage-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "framesage-win Windows service host that runs the policy engine as LocalSystem."

[[bin]]
name = "framesage-svc"
path = "src/main.rs"

[dependencies]
framesage-core = { workspace = true }
framesage-engine = { workspace = true }
framesage-gamemode = { workspace = true }
framesage-ipc = { workspace = true }
framesage-sys = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde_json = { workspace = true }
notify = { workspace = true }

# Day 5 — v0.7 closed-loop ETW consumer. Conditional on policy.closed_loop_enabled
# + build_gate predicate. Spawns supervisor + drop-poll tasks at startup
# when both pass.
framesage-etw = { workspace = true }

[dev-dependencies]
# tracing-test for the build-gate-fallthrough integration test
# (asserts structured tracing event fields, not substring-matching
# the formatted output, per Mode 5 / build-gate log structure
# convention).
tracing-test = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
] }
