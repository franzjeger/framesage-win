[package]
name = "framesage-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "framesage-win Windows service host that runs the policy engine as LocalSystem."

[[bin]]
name = "framesage-svc"
path = "src/main.rs"

[dependencies]
framesage-core = { workspace = true }
framesage-engine = { workspace = true }
framesage-gamemode = { workspace = true }
framesage-ipc = { workspace = true }
framesage-sys = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
notify = { workspace = true }

# Day 5 — v0.7 closed-loop ETW consumer. Conditional on policy.closed_loop_enabled
# + build_gate predicate. Spawns supervisor + drop-poll tasks at startup
# when both pass.
framesage-etw = { workspace = true }

# #111 — PresentMon frame-time source for the session recorder.
framesage-presentmon = { workspace = true }

# v0.7.1 Group C (#110) — sessions read path for the Sessions tab
# (ListSessions / ReadSession IPC served from the sessions dir).
framesage-recorder = { workspace = true }

[dev-dependencies]
# M2.6 / H-004 — enable framesage-etw's build-gate override seam for
# service-side tests (single seam lives in framesage-etw::build_gate;
# the service-local duplicate was removed).
framesage-etw = { workspace = true, features = ["test-override"] }
# tracing-test for the build-gate-fallthrough integration test
# (asserts structured tracing event fields, not substring-matching
# the formatted output, per Mode 5 / build-gate log structure
# convention).
tracing-test = "0.2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-service = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
] }
