[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/sys",
    "crates/ipc",
    "crates/engine",
    "crates/service",
    "crates/cli",
    "crates/tray",
    "crates/sim",
    "crates/gamemode",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
authors = ["Frank Lia <support@sybr.no>"]
repository = "https://github.com/franzjeger/framesage-win"
rust-version = "1.80"

[workspace.dependencies]
# Errors / utility
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime — small set of features, no unneeded surface
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "fs",
] }

# Sync
parking_lot = "0.12"

# CLI
clap = { version = "4", features = ["derive"] }

# Windows bindings. We enable feature sets per-crate to keep build times down.
windows = "0.58"

# Windows service hosting
windows-service = "0.7"

# Tray UI
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.28"
# System tray icon (real persistent tray, not just a window)
tray-icon = "0.24"

# File-system watcher for policy hot-reload
notify = "6"

# Internal crates
framesage-core = { path = "crates/core" }
framesage-sys = { path = "crates/sys" }
framesage-ipc = { path = "crates/ipc" }
framesage-engine = { path = "crates/engine" }
framesage-gamemode = { path = "crates/gamemode" }

# UUIDs for journal session ids
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.release-dbg]
inherits = "release"
strip = "none"
debug = true
