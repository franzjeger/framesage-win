[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/sys",
    "crates/ipc",
    "crates/engine",
    "crates/service",
    "crates/cli",
    "crates/tray",
    "crates/sim",
    "crates/gamemode",
    # v0.7 Phase 1 spike — standalone binary, not wired into the
    # bundled distribution. Lives in the workspace so it picks up
    # the workspace `windows` version + `anyhow` etc., but it's
    # not built by default and the v0.6 release scripts never
    # ship it.
    "crates/spike-etw",
    # v0.7 Group A — ETW kernel-event consumer (Day 1 scaffold).
    # Production crate the service host wires into on Day 5.
    "crates/etw",
]

[workspace.package]
edition = "2021"
# Bumped from 0.1.0 once the project hit Process-Lasso UI/feature parity
# (live process viewer w/ tree view + icons + Description/Company/User
# columns, ProBalance, Game Mode w/ crash-safe journal, CPPC + X3D
# auto-detection, split-pipe ACL, Suspend/Resume/Terminate, etc.). Treating
# this as the pre-1.0 development series — 1.0 lands when there's a signed
# installer and a couple of weeks of real-world use under it.
version = "0.5.0"
license = "Apache-2.0 OR MIT"
authors = ["Frank Lia <support@sybr.no>"]
repository = "https://github.com/franzjeger/framesage-win"
rust-version = "1.80"

[workspace.dependencies]
# Errors / utility
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Item 2.7 — rolling file appender for service + tray on-disk logs.
# Service writes daily-rotated logs to %ProgramData%\framesage\logs\;
# tray writes daily-rotated logs to %LOCALAPPDATA%\FrameSage\logs\.
# Closes audit H-29 (no file-sink logging anywhere).
tracing-appender = "0.2"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime — small set of features, no unneeded surface
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "fs",
] }

# Sync
parking_lot = "0.12"

# CLI
clap = { version = "4", features = ["derive"] }

# Windows bindings. We enable feature sets per-crate to keep build times down.
windows = "0.58"

# Windows service hosting
windows-service = "0.7"

# Tray UI
# Persistence is intentionally OFF: eframe's window-state persistence has
# repeatedly restored broken sizes captured during a buggy session
# (multi-thousand-pixel inner sizes from pre-DPI-manifest drags). Until we
# have a curated set of fields we actually want persisted, the window
# launches fresh at the default size every time — far better UX than
# inheriting yesterday's broken state.
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"
egui_extras = { version = "0.28", default-features = false }
# System tray icon (real persistent tray, not just a window)
tray-icon = "0.24"

# File-system watcher for policy hot-reload
notify = "6"

# Internal crates. Item 3.8: the workspace dep graph is one-way and
# acyclic. See ARCHITECTURE.md at the repo root for the full layering
# diagram + invariants. Adding a new edge between framesage-* crates
# requires updating that file in the same PR.
framesage-core = { path = "crates/core" }
framesage-sys = { path = "crates/sys" }
framesage-ipc = { path = "crates/ipc" }
framesage-engine = { path = "crates/engine" }
framesage-gamemode = { path = "crates/gamemode" }

# UUIDs for journal session ids
uuid = { version = "1", features = ["v4", "serde"] }

# Test utility — temp dirs that clean up on drop. Used in unit tests
# that need a filesystem sandbox (activity-log round-trip, journal
# write tests). Dev-only; not pulled into the runtime binary.
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.release-dbg]
inherits = "release"
strip = "none"
debug = true
